[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meshlens"
dynamic = ["version"]
description = "MeshLens: home network diagnostics for Windows (ASUS AiMesh, ESP32 radio probes, LAN inventory)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.9",
  "paramiko>=3.4",
  "pyyaml>=6.0",
  "keyring>=24",
  "pystray>=0.19",
  "pillow>=10",
  "devolo-plc-api>=1.4",
  "zeroconf>=0.130",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.5"]

[project.scripts]
meshlens = "meshlens.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "meshlens.__version__"}

[tool.setuptools.packages.find]
include = ["meshlens*"]

[tool.setuptools.package-data]
meshlens = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
